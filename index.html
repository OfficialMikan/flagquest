<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlagQuest</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1d2a39;
      --muted: #607184;
      --primary: #1cb0f6;
      --primary-dark: #1899d6;
      --green: #58cc02;
      --green-dark: #47a700;
      --warn: #ffb703;
      --danger: #ff4b4b;
      --border: #dfe8f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: min(100%, 560px);
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 2.4rem);
      text-align: center;
    }

    .top-row, .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eef6ff;
      border: 2px solid var(--border);
      font-weight: 700;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    button:active { transform: translateY(2px); }

    .primary {
      background: var(--green);
      color: white;
      box-shadow: 0 4px 0 var(--green-dark);
    }

    .blue {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .secondary {
      background: white;
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: 0 4px 0 #dfe8f3;
    }

    .danger {
      background: var(--danger);
      color: white;
      box-shadow: 0 4px 0 #d73737;
    }

    .quiz {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }

    .flag {
      font-size: clamp(80px, 20vw, 160px);
      text-align: center;
      line-height: 1;
      margin-bottom: 6px;
    }

    .prompt {
      text-align: center;
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 700;
    }

    .answer-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    #feedback {
      min-height: 24px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
    }

    .mic-on {
      background: #d9f7e8;
      color: #1f7a4a;
      border: 2px solid #aee7c3;
      box-shadow: none;
    }

    @media (max-width: 420px) {
      .answer-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🚩 FlagQuest</h1>

    <div class="top-row">
      <div class="pill" id="timer">30s</div>
      <div class="pill" id="score">0</div>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn">Start Speed Run</button>
      <button class="blue" id="micBtn">Mic: Off</button>
    </div>

    <div class="quiz" id="quizBox">
      <div class="flag" id="flag">🇺🇸</div>
      <div class="prompt">Name this country</div>
      <div class="answer-row">
        <input id="answer" autocomplete="off" placeholder="Type the country name" />
        <button class="secondary" id="checkBtn">Check</button>
      </div>
      <div class="controls">
        <button class="secondary" id="skipBtn">Skip</button>
      </div>
      <div id="feedback">Ready when you are.</div>
    </div>
  </div>

  <script>
    const countries = [
      { name: 'France', flag: '🇫🇷', alt: ['france'] },
      { name: 'Japan', flag: '🇯🇵', alt: ['japan'] },
      { name: 'Brazil', flag: '🇧🇷', alt: ['brazil'] },
      { name: 'Canada', flag: '🇨🇦', alt: ['canada'] },
      { name: 'Germany', flag: '🇩🇪', alt: ['germany'] },
      { name: 'Italy', flag: '🇮🇹', alt: ['italy'] },
      { name: 'Spain', flag: '🇪🇸', alt: ['spain'] },
      { name: 'Argentina', flag: '🇦🇷', alt: ['argentina'] },
      { name: 'India', flag: '🇮🇳', alt: ['india'] },
      { name: 'Australia', flag: '🇦🇺', alt: ['australia'] },
      { name: 'Mexico', flag: '🇲🇽', alt: ['mexico'] },
      { name: 'South Korea', flag: '🇰🇷', alt: ['south korea', 'korea'] },
      { name: 'United States', flag: '🇺🇸', alt: ['united states', 'usa', 'us'] },
      { name: 'United Kingdom', flag: '🇬🇧', alt: ['united kingdom', 'uk', 'britain'] },
      { name: 'Egypt', flag: '🇪🇬', alt: ['egypt'] },
      { name: 'Kenya', flag: '🇰🇪', alt: ['kenya'] },
      { name: 'Nigeria', flag: '🇳🇬', alt: ['nigeria'] },
      { name: 'Norway', flag: '🇳🇴', alt: ['norway'] },
      { name: 'Sweden', flag: '🇸🇪', alt: ['sweden'] },
      { name: 'Thailand', flag: '🇹🇭', alt: ['thailand'] },
      { name: 'Vietnam', flag: '🇻🇳', alt: ['vietnam'] },
      { name: 'Chile', flag: '🇨🇱', alt: ['chile'] },
      { name: 'Peru', flag: '🇵🇪', alt: ['peru'] },
      { name: 'Poland', flag: '🇵🇱', alt: ['poland'] },
      { name: 'Turkey', flag: '🇹🇷', alt: ['turkey'] }
    ];

    const state = {
      current: null,
      score: 0,
      timer: 30,
      running: false,
      interval: null,
      speech: null,
      micOn: false
    };

    const $ = (id) => document.getElementById(id);

    function normalize(value = '') {
      return value
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function updateTimer() {
      $('timer').textContent = `${state.timer}s`;
      $('score').textContent = String(state.score);
    }

    function chooseNextCountry() {
      const pool = countries.filter(country => country.name !== state.current?.name);
      state.current = pool[Math.floor(Math.random() * pool.length)] || countries[0];
      $('flag').textContent = state.current.flag;
      $('answer').value = '';
      $('answer').focus();
      $('feedback').textContent = 'Ready when you are.';
    }

    function finishRound() {
      state.running = false;
      clearInterval(state.interval);
      if (state.micOn) toggleMic(false);
      $('feedback').textContent = `Time's up! Final score: ${state.score}`;
      $('startBtn').textContent = 'Play Again';
    }

    function tick() {
      if (!state.running) return;
      state.timer -= 1;
      updateTimer();

      if (state.timer <= 0) {
        finishRound();
      }
    }

    function startGame() {
      state.running = true;
      state.score = 0;
      state.timer = 30;
      updateTimer();
      $('startBtn').textContent = 'Restart';
      chooseNextCountry();
      clearInterval(state.interval);
      state.interval = setInterval(tick, 1000);
    }

    function handleCorrect() {
      state.score += 1;
      updateTimer();
      $('feedback').textContent = `Correct! ${state.current.name}`;
      chooseNextCountry();
    }

    function isMatch(value) {
      const cleaned = normalize(value);
      const target = normalize(state.current.name);
      return cleaned === target || state.current.alt.some(item => normalize(item) === cleaned);
    }

    function checkAnswer() {
      if (!state.running || !state.current) return;
      const typed = $('answer').value;
      if (!typed.trim()) return;

      if (isMatch(typed)) {
        handleCorrect();
      } else {
        $('feedback').textContent = `Not quite — it was ${state.current.name}.`;
        chooseNextCountry();
      }
    }

    function toggleMic(forceOn = null) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        $('feedback').textContent = 'Voice input is not supported in this browser.';
        return;
      }

      if (!state.speech) {
        state.speech = new SpeechRecognition();
        state.speech.lang = 'en-US';
        state.speech.continuous = true;
        state.speech.interimResults = true;

        state.speech.onresult = (event) => {
          let full = '';
          for (let i = 0; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0]?.transcript || '';
            if (transcript) {
              full += transcript;
            }
          }

          if (!full.trim()) return;
          $('answer').value = full.trim();

          const lastResult = event.results[event.results.length - 1];
          if (lastResult && lastResult.isFinal) {
            if (state.running) checkAnswer();
          }
        };

        state.speech.onerror = () => {
          state.micOn = false;
          $('micBtn').classList.remove('mic-on');
          $('micBtn').textContent = 'Mic: Off';
        };

        state.speech.onend = () => {
          if (state.micOn) {
            try {
              state.speech.start();
            } catch (_) {
              // ignore start errors while restarting
            }
          }
        };
      }

      const shouldBeOn = forceOn !== null ? forceOn : !state.micOn;

      if (shouldBeOn) {
        try {
          state.speech.start();
          state.micOn = true;
          $('micBtn').classList.add('mic-on');
          $('micBtn').textContent = 'Mic: On';
        } catch (_) {
          // ignore if already started
        }
      } else {
        state.speech.stop();
        state.micOn = false;
        $('micBtn').classList.remove('mic-on');
        $('micBtn').textContent = 'Mic: Off';
      }
    }

    $('startBtn').addEventListener('click', startGame);
    $('checkBtn').addEventListener('click', checkAnswer);
    $('skipBtn').addEventListener('click', () => {
      if (!state.running) return;
      $('feedback').textContent = `Skipped — it was ${state.current.name}.`;
      chooseNextCountry();
    });
    $('answer').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') checkAnswer();
    });
    $('micBtn').addEventListener('click', () => toggleMic());

    updateTimer();
    chooseNextCountry();
  </script>
</body>
</html>
